name: Generate and Deploy Static Site

on:
  push:
    branches: [ main ]

# Даем права на запись в репозиторий для деплоя
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Установка системных либ для Chrome, чтобы Puppeteer не подох
      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2

      # Явная установка браузера для Puppeteer
      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Generate Static Site
        run: pnpm run generate
        env:
          APP_ENV: production
          # Puppeteer может требовать этот флаг в некоторых окружениях
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: ${{ env.PUPPETEER_EXECUTABLE_PATH }}

      # Деплой на GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          # Оставляем .dotfiles (важно для .nojekyll)
          allow_empty_commit: false
          keep_files: false
